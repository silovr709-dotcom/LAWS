name: Deploy to GitHub Pages

on:
  push:
    # Деплой запускается с ЛЮБОЙ ветки: правки из сессии сразу попадают на сайт,
    # без PR и merge. Ветка указывается в логе сборки.
    branches: ['**']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Show source branch
        run: echo "Деплой из ветки: ${{ github.ref_name }} (${{ github.sha }})"

      - name: Build site
        env:
          PUBLIC_SITE_URL: https://silovr709-dotcom.github.io
          BASE_PATH: /LAWS
          # На GitHub Pages нет серверной части: форма ведёт в диалог ВКонтакте (или mailto, если указана почта).
          PUBLIC_FORM_ENDPOINT: mailto
          # Временный адрес закрыт от индексации. Для боевого домена — убрать.
          PUBLIC_NOINDEX: 'true'
        run: npm run build

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist/client

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
